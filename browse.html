<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Watcher - Browse</title>
<meta name="theme-color" content="#0b1f3a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<section class="hero"><div>
  <h1>Browse open postings</h1>
  <p class="sub">Filter, search and star postings. Your shortlist stays in this browser.</p>
</div></section>
<main>
  <div id="banner"></div>
  <div class="controls">
    <div class="seg" role="group" aria-label="Which postings">
      <button id="m-role" class="on" aria-pressed="true">In my role</button>
      <button id="m-all" aria-pressed="false">All postings</button>
    </div>
    <label>Employer <select id="f-emp"><option value="">All employers</option></select></label>
    <label>Location <select id="f-loc"><option value="">All locations</option></select></label>
    <label>Days open
      <select id="f-days">
        <option value="">Any</option>
        <option value="0-0">Seen today</option>
        <option value="0-7">7 days or less</option>
        <option value="0-30">30 days or less</option>
        <option value="31-">More than 30 days</option>
      </select></label>
    <label>Title <input id="f-q" type="search" placeholder="Search titles"></label>
    <label>Sort by first seen
      <select id="f-sort"><option value="desc">Newest first</option><option value="asc">Oldest first</option></select></label>
    <label class="chk"><input id="f-star" type="checkbox"> Shortlist only</label>
  </div>
  <p class="count" id="count" aria-live="polite"></p>
  <div id="list"></div>
  <p><button id="more" hidden>Show more</button></p>
</main>
<script src="assets/site.js"></script>
<script src="assets/browse.js"></script>
</body>
</html>
